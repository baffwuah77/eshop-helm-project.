{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
{{- $persist := and $c.persistence $c.persistence.enabled }}
{{- if $persist }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $.Values.global.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $c.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: eshop
spec:
  replicas: {{ $c.replicas | default $.Values.global.replicas }}
  {{- if $persist }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $c.image.repository }}:{{ $c.image.tag | default $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $c.containerPort }}
          {{- if or $c.env $c.secretEnv }}
          env:
            {{- range $k, $v := $c.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $key := $c.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: eshop-secrets
                  key: {{ $key }}
            {{- end }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ $c.containerPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ $c.containerPort }}
            initialDelaySeconds: 40
            periodSeconds: 20
          {{- with ($c.resources | default $.Values.global.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $persist }}
          volumeMounts:
            - name: data
              mountPath: {{ $c.persistence.mountPath }}
          {{- end }}
      {{- if $persist }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - port: {{ $c.servicePort }}
      targetPort: {{ $c.containerPort }}
{{- end }}
{{- end }}
